# Python packaging for `pip install` / `pipx install`.
# The PyPI names "pyhttp" and "pyhttp-client"/"pyhttpclient" are taken by unrelated
# projects, so the distribution is "pyhttp-app"; the import name and the `pyhttp`
# command are unchanged.
# The pyhttp Free License 1.1 (LICENSE.md) expressly covers this PyPI source
# distribution: it may be inspected, installed and modified for your own use,
# but modified versions may not be distributed.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhttp-app"
description = "Local API client and alternative to Postman: collection runner, Postman-compatible scripts, mock servers and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "pyhttp Dev Team", email = "dev@pyhttp.com" }]
keywords = ["http", "api", "client", "postman", "rest", "testing", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pywebview>=5.0",
    'quickjs>=1.19; python_version < "3.13"',
    "mini-racer>=0.12; python_version >= '3.13'",
    "pyyaml>=6.0",
    "mcp>=2",
]

[project.urls]
Homepage = "https://pyhttp.com"

[project.scripts]
pyhttp = "pyhttp.__main__:main"

[tool.setuptools]
packages = ["pyhttp"]

[tool.setuptools.dynamic]
version = { attr = "pyhttp.__version__" }

[tool.setuptools.package-data]
pyhttp = ["pm.js", "static/*", "static/vendor/*", "static/vendor/fonts/*"]
