# Builds the desktop apps on GitHub's machines:
#   Windows -> pyhttp-<version>-windows-x64.exe          (portable)
#              pyhttp-<version>-windows-x64-setup.exe    (installer, Inno Setup)
#   macOS   -> pyhttp-<version>-macos-arm64.dmg          (Apple Silicon)
#   Linux   -> pyhttp-<version>-linux-amd64.deb          (Ubuntu 22.04+ / Debian 12+, built on 22.04 for glibc compatibility)
# The release also gets SHA256SUMS.txt, which the in-app updater uses to verify downloads.
#
# Every push to main runs the tests and builds (files appear under the run's
# Artifacts for one day). Nothing is published automatically. Releases do not use
# artifacts: each build uploads straight to a draft release, which is published at the end. To publish a release to the
# public releases repository, either push a tag (git tag v0.2.0 && git push origin v0.2.0)
# or run the workflow by hand from the Actions tab and tick "publish". The release is
# tagged v<version> from pyhttp/__init__.py; publishing the same version again replaces
# the existing release.
#
# One-time setup in this repository (Settings > Secrets and variables > Actions):
#   secret RELEASE_TOKEN: fine-grained PAT with Contents: read and write on
#     pyhttp2/pyhttp-releases (GITHUB_TOKEN cannot write to another repository).
# Optional, removes the macOS "Apple could not verify" warning (needs an Apple
# Developer Program membership):
#   secret MACOS_CERT_P12: Developer ID Application certificate, base64 of the .p12
#   secret MACOS_CERT_PASSWORD: password of that .p12
#   secret MACOS_SIGN_IDENTITY: e.g. "Developer ID Application: Your Name (TEAMID)"
#   secret APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD: for notarization (app-specific password)
name: Build and publish desktop apps

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as a release in pyhttp2/pyhttp-releases"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

env:
  RELEASE_REPO: pyhttp2/pyhttp-releases

# One run per commit: a release pushes main and the tag at once, and the tag run (which
# publishes) supersedes the main run instead of competing with it for a macOS runner.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Artifacts count against the account's storage quota (installers are large and used to be
  # kept 90 days), so old ones are deleted on every run. A full quota once failed every build.
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts of earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" && echo "deleted artifact ${id}"; done

  # For a release: check the version and start a draft release that the build jobs upload to
  # directly. Releases therefore never depend on artifact storage.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('pyhttp/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ = $VERSION in pyhttp/__init__.py. Use: python packaging/bump.py ${GITHUB_REF#refs/tags/v}"
            exit 1
          fi

      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_TOKEN is not set. Create a fine-grained PAT with Contents: write on ${RELEASE_REPO} and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Replace any release of this version with an empty draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # same version => replace the whole release (old assets and notes disappear)
          gh release delete "v${VERSION}" --repo "$RELEASE_REPO" --yes --cleanup-tag || echo "no previous release"
          gh release create "v${VERSION}" --repo "$RELEASE_REPO" --draft --title "pyhttp ${VERSION}" --notes "Building…"

  build:
    needs: prepare
    # also runs for plain pushes to main, where prepare is skipped
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist/pyhttp-*-windows-x64*.exe
          - os: macos-15              # Apple Silicon (arm64). Pinned: macos-latest moved to macOS 26 and its runner pool
                                      # left our jobs queued for 15 minutes and cancelled (Oct 2026).
            files: dist/pyhttp-*-macos-*.dmg
          - os: ubuntu-22.04          # oldest glibc we support: the .deb then runs on 22.04, 24.04 and Debian 12+
            files: dist/pyhttp-*-linux-*.deb
          # For Intel Macs add an Intel macOS runner here (check GitHub's current
          # runner labels), or run `python packaging/build.py` on an Intel Mac.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Test
        run: |
          pip install pytest
          python -m pytest tests/test_backend.py -q

      - name: Install Linux build dependencies (GTK bindings, packaging tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 dpkg-dev binutils xvfb
          pip install "PyGObject<3.51" pycairo

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Inno Setup compiler: $($iscc.FullName)"

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          PYHTTP_GITHUB_REPO: ${{ env.RELEASE_REPO }}   # where the app checks for updates
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/build.py

      - name: Smoke-test the .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/pyhttp-*-linux-*.deb
          pyhttp --server --port 8765 --data-dir /tmp/pyhttp-data &
          SERVER_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8765/api/meta | python3 -c "import json,sys; m=json.load(sys.stdin); print(m['version'], m['install']); assert m['install']['kind'] == 'deb'"
          kill "$SERVER_PID"
          GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a pyhttp --data-dir /tmp/pyhttp-data &
          sleep 10
          grep -q "pyhttp window open" /tmp/pyhttp-data/pyhttp.log 2>/dev/null || { echo "::warning::no 'window open' line in the log (see below)"; cat /tmp/pyhttp-data/pyhttp.log 2>/dev/null || true; }
          pkill -x pyhttp || true

      - name: Upload to the draft release
        if: needs.prepare.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" ${{ matrix.files }} --repo "$RELEASE_REPO" --clobber

      # Test builds (pushes to main) keep their files for a day. A full storage quota must not
      # fail the build, so this step may fail without failing the job.
      - uses: actions/upload-artifact@v4
        if: needs.prepare.result != 'success'
        continue-on-error: true
        with:
          name: pyhttp-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1

  release:
    # only for version tags, or a manual run with "publish" ticked
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the built files from the draft
        run: |
          mkdir artifacts
          gh release download "v${VERSION}" --repo "$RELEASE_REPO" --dir artifacts --pattern 'pyhttp-*'

      - name: Checksums
        run: |
          cd artifacts
          ls -la
          test -f pyhttp-*-windows-x64-setup.exe || { echo "::error::the Windows installer is missing"; exit 1; }
          test -f pyhttp-*-linux-amd64.deb || { echo "::error::the Linux .deb is missing"; exit 1; }
          sha256sum pyhttp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to ${{ env.RELEASE_REPO }}
        run: |
          cat > notes.md <<'EOF'
          pyhttp @VERSION@, built from @SHA@.

          - Windows 10/11: run the installer `pyhttp-@VERSION@-windows-x64-setup.exe` (per user, no admin rights, Start menu entry, uninstaller), or use the portable `pyhttp-@VERSION@-windows-x64.exe` (one file, no install). SmartScreen: More info → Run anyway.
          - macOS (Apple Silicon): `brew tap pyhttp2/pyhttp https://github.com/pyhttp2/pyhttp-releases && brew install --cask pyhttp2/pyhttp/pyhttp`, or open the `.dmg` and drag pyhttp to Applications.
            If macOS says it cannot verify the app: System Settings → Privacy & Security → Open Anyway, or `xattr -dr com.apple.quarantine /Applications/pyhttp.app`.
          - Ubuntu 22.04+ / Debian 12+: `sudo apt install ./pyhttp-@VERSION@-linux-amd64.deb` (uses the distro's GTK and WebKitGTK; other distros run from source).
          - Any OS with Python 3.10+: `pip install pyhttp-app` (or `brew install pyhttp2/pyhttp/pyhttp-app`), then run `pyhttp`.
          - Updating: pyhttp shows an **Update** button when a newer version exists. On Windows (installer or portable) and on macOS installed with Homebrew it downloads and installs the update itself and restarts; other installs get the download and the commands to run. `SHA256SUMS.txt` lists the checksums of the files above.

          Free for everyone under the pyhttp Free License 1.1 (LICENSE.md): home or work, any company size, any purpose, no fees. By downloading you accept LICENSE.md. Bundled components: THIRD-PARTY-NOTICES.md.
          EOF
          sed -i "s/@VERSION@/${VERSION}/g; s/@SHA@/${GITHUB_SHA}/g" notes.md
          gh release upload "v${VERSION}" artifacts/SHA256SUMS.txt LICENSE.md THIRD-PARTY-NOTICES.md --repo "$RELEASE_REPO" --clobber
          gh release edit "v${VERSION}" --repo "$RELEASE_REPO" --title "pyhttp ${VERSION}" --notes-file notes.md --draft=false --latest

      - name: Update the Homebrew cask in ${{ env.RELEASE_REPO }}
        run: |
          DMG=$(ls artifacts/pyhttp-*-macos-arm64.dmg | head -1)
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" rel
          mkdir -p rel/Casks
          cat > rel/Casks/pyhttp.rb <<EOF
          cask "pyhttp" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/${RELEASE_REPO}/releases/download/v#{version}/pyhttp-#{version}-macos-arm64.dmg"
            name "pyhttp"
            desc "Local, Postman-like HTTP client with a collection runner"
            homepage "https://github.com/${RELEASE_REPO}"

            depends_on arch: :arm64
            app "pyhttp.app"

            zap trash: "~/Library/Application Support/pyhttp"
          end
          EOF
          cd rel
          git config user.name "pyhttp"
          git config user.email "dev@pyhttp.com"
          git add Casks/pyhttp.rb
          git commit -m "Homebrew cask: pyhttp ${VERSION}" || echo "cask unchanged"
          git push

      # PyPI: the same version as the tag, as pyhttp-app (the name pyhttp is taken).
      # Needs secret PYPI_API_TOKEN (a pypi.org API token for the pyhttp-app project);
      # without it this step is skipped with a warning instead of failing the release.
      - name: Publish to PyPI (pyhttp-app)
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::warning::Secret PYPI_API_TOKEN is not set; skipping the PyPI upload. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          python3 -m pip install --quiet build twine
          python3 -m build
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" python3 -m twine upload --non-interactive dist/*
          echo "uploaded https://pypi.org/project/pyhttp-app/${VERSION}/"

      - name: Update the Homebrew formula in ${{ env.RELEASE_REPO }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ] || [ ! -f dist/pyhttp_app-${VERSION}.tar.gz ]; then
            echo "::warning::no PyPI upload, leaving Formula/pyhttp-app.rb unchanged"
            exit 0
          fi
          SHA=$(sha256sum "dist/pyhttp_app-${VERSION}.tar.gz" | cut -d' ' -f1)
          # the sdist URL contains a content hash; ask PyPI for it (retry while the index catches up)
          for i in 1 2 3 4 5 6; do
            URL=$(curl -fsS "https://pypi.org/pypi/pyhttp-app/${VERSION}/json" | python3 -c "import json,sys; print(next(u['url'] for u in json.load(sys.stdin)['urls'] if u['packagetype']=='sdist'))") && break
            echo "PyPI index not ready, retry $i"; sleep 20
          done
          test -n "$URL"
          cd rel
          sed -i -E "s|^  url \".*\"$|  url \"${URL}\"|; s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" Formula/pyhttp-app.rb
          git add Formula/pyhttp-app.rb
          git commit -m "Homebrew formula: pyhttp-app ${VERSION}" || echo "formula unchanged"
          git push
