# Builds the desktop apps on GitHub's machines:
#   Windows -> pyhttp-<version>-windows-x64.exe          (portable)
#              pyhttp-<version>-windows-x64-setup.exe    (installer, Inno Setup)
#   macOS   -> pyhttp-<version>-macos-arm64.dmg          (Apple Silicon)
#   Linux   -> pyhttp-<version>-linux-amd64.deb          (Ubuntu 22.04+ / Debian 12+, built on 22.04 for glibc compatibility)
# The release also gets SHA256SUMS.txt, which the in-app updater uses to verify downloads.
#
# Every push to main only runs the tests, on all three systems. The installers are built
# for a release (a version tag, see below) or when the workflow is run by hand from the
# Actions tab: without "publish" that is a test build whose files appear under the run's
# Artifacts for one day (do this after touching packaging/ or the requirements, since a
# plain push no longer proves that packaging still works). Releases do not use
# artifacts: each build uploads straight to a draft release, which is published at the end.
# To publish a release, either push a tag (deploy.bat / packaging/bump.py do this)
# or run the workflow by hand from the Actions tab and tick "publish". The release is
# tagged v<version> from pyhttp/__init__.py; publishing the same version again replaces
# the existing release.
#
# Releases are published on THIS repository's Releases page (GITHUB_TOKEN is enough)
# and then, best effort: uploaded to PyPI as pyhttp-app, and the Homebrew tap gets the
# new cask and formula. Those extra steps warn and are skipped when their secret is
# missing; they never fail the release itself. (Releases used to live in
# pyhttp2/pyhttp-releases; no release is published there any more, only the cask file
# for Macs that still tap it, see LEGACY_TAP_REPO.)
#
# One-time setup in this repository (Settings > Secrets and variables > Actions):
#   secret RELEASE_TOKEN: fine-grained PAT with Contents: read and write on
#     pyhttp2/homebrew-pyhttp and pyhttp2/pyhttp-releases (GITHUB_TOKEN cannot write
#     to other repositories). Used only for the taps.
#   secret PYPI_API_TOKEN: a pypi.org API token for the pyhttp-app project.
# Optional, removes the macOS "Apple could not verify" warning (needs an Apple
# Developer Program membership):
#   secret MACOS_CERT_P12: Developer ID Application certificate, base64 of the .p12
#   secret MACOS_CERT_PASSWORD: password of that .p12
#   secret MACOS_SIGN_IDENTITY: e.g. "Developer ID Application: Your Name (TEAMID)"
#   secret APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD: for notarization (app-specific password)
name: Build and publish desktop apps

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as a release of this repository"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # gh release on this repository

env:
  TAP_REPO: pyhttp2/homebrew-pyhttp      # Homebrew tap: brew install pyhttp2/pyhttp/<name>
  # Macs that tapped pyhttp2/pyhttp before the move still fetch the cask from this repository, so it
  # gets the same cask/formula files (nothing else: releases are not mirrored). The app re-points
  # such taps at TAP_REPO on its next update, so this can be dropped once old installs are gone.
  LEGACY_TAP_REPO: pyhttp2/pyhttp-releases

# One run per commit: a release pushes main and the tag at once, and the tag run (which
# publishes) supersedes the main run instead of competing with it for a macOS runner.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Artifacts count against the account's storage quota (installers are large and used to be
  # kept 90 days), so old ones are deleted on every run. A full quota once failed every build.
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts of earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" && echo "deleted artifact ${id}"; done

  # For a release: check the version and start a draft release that the build jobs upload to
  # directly. Releases therefore never depend on artifact storage.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('pyhttp/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ = $VERSION in pyhttp/__init__.py. Use: python packaging/bump.py ${GITHUB_REF#refs/tags/v}"
            exit 1
          fi

      - name: Check secrets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "$RELEASE_TOKEN" ] || echo "::warning::Secret RELEASE_TOKEN is not set: the release will publish here, but the Homebrew tap will be skipped."
          [ -n "$PYPI_API_TOKEN" ] || echo "::warning::Secret PYPI_API_TOKEN is not set: the PyPI upload will be skipped."

      - name: Start an empty draft for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # A release that is already PUBLISHED for this version is never touched: pushing the tag
          # again (or re-running) must not delete what users already download. Bump the version
          # instead, or delete the release by hand first. A leftover draft is replaced.
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::v${VERSION} is already published at https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}. Release a new version (python packaging/bump.py <next>), or delete that release first if you really mean to replace it."
            exit 1
          fi
          gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes || echo "no previous draft"
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft --title "pyhttp ${VERSION}" --notes "Building…"

  # Plain pushes to main: the tests on every system, no installers.
  test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]   # the same systems the build job packages on
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest tests/test_backend.py -q

  build:
    needs: prepare
    # releases (prepare ran) and manual runs (a test build when "publish" is not ticked, where
    # prepare is skipped); plain pushes to main only run the test job above
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist/pyhttp-*-windows-x64*.exe
          - os: macos-latest          # Apple Silicon (arm64). macos-15 runners stopped picking up this repo's
                                      # jobs (queued 15 min, then cancelled; Nov 2026), so track the current pool.
            files: dist/pyhttp-*-macos-*.dmg
          - os: ubuntu-22.04          # oldest glibc we support: the .deb then runs on 22.04, 24.04 and Debian 12+
            files: dist/pyhttp-*-linux-*.deb
          # For Intel Macs add an Intel macOS runner here (check GitHub's current
          # runner labels), or run `python packaging/build.py` on an Intel Mac.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Test
        run: |
          pip install pytest
          python -m pytest tests/test_backend.py -q

      - name: Install Linux build dependencies (GTK bindings, packaging tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 dpkg-dev binutils xvfb
          pip install "PyGObject<3.51" pycairo

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Inno Setup compiler: $($iscc.FullName)"

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          PYHTTP_GITHUB_REPO: ${{ github.repository }}  # where the app checks for updates
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/build.py

      - name: Smoke-test the .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/pyhttp-*-linux-*.deb
          pyhttp --server --port 8765 --data-dir /tmp/pyhttp-data &
          SERVER_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8765/api/meta | python3 -c "import json,sys; m=json.load(sys.stdin); print(m['version'], m['install']); assert m['install']['kind'] == 'deb'"
          kill "$SERVER_PID"
          GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a pyhttp --data-dir /tmp/pyhttp-data &
          sleep 10
          grep -q "pyhttp window open" /tmp/pyhttp-data/pyhttp.log 2>/dev/null || { echo "::warning::no 'window open' line in the log (see below)"; cat /tmp/pyhttp-data/pyhttp.log 2>/dev/null || true; }
          pkill -x pyhttp || true

      - name: Upload to the draft release
        if: needs.prepare.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" ${{ matrix.files }} --repo "$GITHUB_REPOSITORY" --clobber

      # Test builds (manual runs without "publish") keep their files for a day. A full storage quota must not
      # fail the build, so this step may fail without failing the job.
      - uses: actions/upload-artifact@v4
        if: needs.prepare.result != 'success'
        continue-on-error: true
        with:
          name: pyhttp-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1

  release:
    # only for version tags, or a manual run with "publish" ticked
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the built files from the draft
        run: |
          mkdir artifacts
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern 'pyhttp-*'

      - name: Checksums
        run: |
          cd artifacts
          ls -la
          test -f pyhttp-*-windows-x64-setup.exe || { echo "::error::the Windows installer is missing"; exit 1; }
          test -f pyhttp-*-linux-amd64.deb || { echo "::error::the Linux .deb is missing"; exit 1; }
          sha256sum pyhttp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        run: |
          cat > notes.md <<'EOF'
          pyhttp @VERSION@, built from @SHA@.

          - Windows 10/11: run the installer `pyhttp-@VERSION@-windows-x64-setup.exe` (per user, no admin rights, Start menu entry, uninstaller), or use the portable `pyhttp-@VERSION@-windows-x64.exe` (one file, no install). SmartScreen: More info → Run anyway.
          - macOS (Apple Silicon): `brew install --cask pyhttp2/pyhttp/pyhttp`, or open the `.dmg` and drag pyhttp to Applications.
            If macOS says it cannot verify the app: System Settings → Privacy & Security → Open Anyway, or `xattr -dr com.apple.quarantine /Applications/pyhttp.app`.
          - Ubuntu 22.04+ / Debian 12+: `sudo apt install ./pyhttp-@VERSION@-linux-amd64.deb` (uses the distro's GTK and WebKitGTK; other distros run from source).
          - Any OS with Python 3.10+: `pip install pyhttp-app` (or `brew install pyhttp2/pyhttp/pyhttp`), then run `pyhttp`.
          - Updating: pyhttp shows an **Update** button when a newer version exists. On Windows (installer or portable) and on macOS installed with Homebrew it downloads and installs the update itself and restarts; other installs get the download and the commands to run. `SHA256SUMS.txt` lists the checksums of the files above.

          Free for everyone under the pyhttp Free License 1.1 (LICENSE.md): home or work, any company size, any purpose, no fees. By downloading you accept LICENSE.md. Bundled components: THIRD-PARTY-NOTICES.md.
          EOF
          sed -i "s/@VERSION@/${VERSION}/g; s/@SHA@/${GITHUB_SHA}/g" notes.md
          gh release upload "v${VERSION}" artifacts/SHA256SUMS.txt LICENSE.md THIRD-PARTY-NOTICES.md --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "pyhttp ${VERSION}" --notes-file notes.md --draft=false --latest

      # The Python package (pyhttp-app). The sdist is attached to the release above and is
      # what the Homebrew formula installs, so brew does not depend on PyPI being updated.
      - name: Build the Python package and attach the sdist to the release
        run: |
          python3 -m pip install --quiet build
          python3 -m build
          gh release upload "v${VERSION}" "dist/pyhttp_app-${VERSION}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

      # PyPI gets the same files (the pip install channel). Skipped with a warning
      # when PYPI_API_TOKEN is missing; never fails the release.
      - name: Publish to PyPI (pyhttp-app)
        continue-on-error: true
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::warning::Secret PYPI_API_TOKEN is not set; skipping the PyPI upload."
            exit 0
          fi
          python3 -m pip install --quiet twine
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" python3 -m twine upload --non-interactive dist/*
          echo "uploaded https://pypi.org/project/pyhttp-app/${VERSION}/"

      # The cask points at this repository's release assets; the formula at the sdist attached
      # to the release. Pushed to the tap (homebrew-pyhttp). Best effort: a tap problem must
      # not fail the release that already published above.
      - name: Update the Homebrew taps (cask + formula)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set; skipping the Homebrew tap."
            exit 0
          fi
          DMG=$(ls artifacts/pyhttp-*-macos-arm64.dmg | head -1)
          DMG_SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          mkdir tap-files
          cat > tap-files/pyhttp.rb <<EOF
          cask "pyhttp" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/pyhttp-#{version}-macos-arm64.dmg"
            name "pyhttp"
            desc "Local API client with a collection runner (alternative to Postman)"
            homepage "https://pyhttp.com"

            depends_on arch: :arm64
            app "pyhttp.app"

            zap trash: "~/Library/Application Support/pyhttp"
          end
          EOF
          # the formula installs the sdist attached to this release (not the PyPI copy)
          if [ -f "dist/pyhttp_app-${VERSION}.tar.gz" ]; then
            SDIST_SHA=$(sha256sum "dist/pyhttp_app-${VERSION}.tar.gz" | cut -d' ' -f1)
            SDIST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/pyhttp_app-${VERSION}.tar.gz"
          fi
          for REPO in "$TAP_REPO" "$LEGACY_TAP_REPO"; do
            rm -rf tap && git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" tap || { echo "::warning::cannot clone ${REPO}"; continue; }
            mkdir -p tap/Casks tap/Formula
            cp tap-files/pyhttp.rb tap/Casks/pyhttp.rb
            if [ -n "${SDIST_URL:-}" ] && [ -f tap/Formula/pyhttp.rb ]; then
              sed -i -E "s|^  url \".*\"$|  url \"${SDIST_URL}\"|; s|^  sha256 \".*\"$|  sha256 \"${SDIST_SHA}\"|" tap/Formula/pyhttp.rb
            fi
            cd tap
            git config user.name "pyhttp Dev Team"
            git config user.email "dev@pyhttp.com"
            git add Casks/pyhttp.rb Formula/pyhttp.rb 2>/dev/null || git add Casks/pyhttp.rb
            git commit -m "pyhttp ${VERSION}: cask + formula" || echo "tap ${REPO} unchanged"
            git push
            cd ..
          done
